liip_imagine:
    driver: "gd"

    resolvers:
        default:
            web_path:
                web_root: "%kernel.project_dir%/public"
                cache_prefix: "media/cache"

    loaders:
        default:
            filesystem:
                data_root: "%kernel.project_dir%/public"

    filter_sets:
        cache: ~

        # apercu grille 3 colonnes (accueil + portfolio)
        photo_thumb:
            format: webp
            quality: 82
            filters:
                thumbnail: { size: [600, 600], mode: outbound }
                strip: ~

        # affichage plein ecran du portfolio detaille - large pour rester net
        # en full-bleed sur les tres grands ecrans (photo-titre-bloc)
        photo_large:
            format: webp
            quality: 88
            filters:
                thumbnail: { size: [2400, 2400], mode: inset }
                strip: ~
